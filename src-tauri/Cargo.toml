[package]
name = "where-were-we"
version = "0.1.0"
description = "AI가 만드는 프로젝트의 화면·동작·흐름 현황판"
authors = ["ganggangstone"]
license-file = "../LICENSE"
repository = "https://github.com/ganggangstone/where-were-we"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.3" }
