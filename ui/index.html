const UI_PATTERN = new RegExp(Object.keys(UI_EN).sort((a, b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'g');
function tr(text) { return S.lang === 'en' ? String(text).replace(UI_PATTERN, match => UI_EN[match]) : String(text); }
function ui(parts, ...values) { return parts.reduce((out, part, i) => out + tr(part) + (i < values.length ? values[i] : ''), ''); }
function helpDetails(html,title='자세히') {
  return `<details class="context-help"><summary>${esc(tr(title))}</summary>${html}</details>`;
}
function helpText(text,title='자세히') { return helpDetails(`<p class="s">${esc(tr(text))}</p>`,title); }
// Shared presentation only: values are escaped by callers; no collection or analysis state is changed.
function metaList(items) {
  return `<dl class="metadata">${items.filter(([,value])=>value!==null && value!==undefined && value!=='').map(([label,value,translate=true])=>`<div><dt>${esc(translate?tr(label):label)}</dt><dd>${value}</dd></div>`).join('')}</dl>`;
}
function sectionHeading(title,actions='',status='',id='') {
  return `<div class="section-heading"><div class="heading-label"><h2${id?` id="${esc(id)}"`:""}>${esc(tr(title))}</h2>${status}</div>${actions?`<div class="heading-actions">${actions}</div>`:''}</div>`;
}
function periodRows(repositories) {
  return `<div class="period-list">${repositories.map(r=>`<div class="period-row"><span class="period-name">${esc(connectionDisplayName(r.id || r.repository || 'legacy'))}</span><span class="period-dates"><time ${r.since?`datetime="${esc(r.since)}"`:''}>${r.since?when(r.since):'—'}</time><span aria-hidden="true">→</span><time ${r.at?`datetime="${esc(r.at)}"`:''}>${r.at?when(r.at):'—'}</time></span></div>`).join('')}</div>`;
}
function lineLegend(items) {
  return `<div class="line-legend">${items.map(([type,label])=>`<span><i class="legend-sample ${type}" aria-hidden="true"></i>${esc(tr(label))}</span>`).join('')}</div>`;
}
// 알려진 오류는 번역한 안내로 보여 주고, 원문(경로·명령·복구 위치 포함)은 접힌 칸에서 그대로 읽고 복사할 수 있게 둔다.
function errorDetails(raw) { return raw ? `<details class="context-help error-detail"><summary>${tr('오류 내용')}</summary><pre class="prompt mono">${esc(raw)}</pre><button class="btn quiet" data-copy-error>${tr('오류 내용 복사')}</button></details>` : ''; }
function errorHtml(message,raw) { return esc(message)+errorDetails(raw); }
function connectionDisplayName(id) {
  const repo=S.projectInfo?.repositories?.find(repo=>repo.id===id);
  return repo ? repo.name || id : id==='legacy' ? S.project || tr('현재 서비스') : id;
}
function versionRefs(branch) {
  const repos=(S.projectInfo?.repositories || []).filter(r=>!S.repository || r.id===S.repository);
  const refs=repos.map(r=>[r.name || r.id,r.refs?.[branch]]).filter(([,ref])=>ref);
  return refs.length ? refs : S.maps[branch]?.ref ? [['',S.maps[branch].ref]] : [];
}
function versionName(branch) {
  const refs=versionRefs(branch),names=[...new Set(refs.map(([,ref])=>ref))];
  return names.join(' · ') || tr('코드 이름 없음');
}
function setStatus(text,error=false,raw='') {
  const el=$('status');el.textContent=text;el.title=text;el.className=error && text ? 'error' : '';
  const box=$('error-detail');box.hidden=!(error && text && raw);box.innerHTML=box.hidden ? '' : `<summary>${tr('오류 내용')}</summary><pre class="prompt mono">${esc(raw)}</pre><button class="btn quiet" data-copy-error>${tr('오류 내용 복사')}</button>`;

async function saveConnections(project,configuration,known=[],progress=()=>{}) {
  const response=await invoke('save_project',{project,configuration:JSON.stringify(configuration)});
  const saved=response?JSON.parse(response):configuration;
  const pending=saved.repositories.filter(r=>r.url && !known.find(k=>k.id===r.id && k.url===r.url && k.collected));
  const collection=[];
  for(const repo of pending){
    progress(repo);
    try{const log=await invoke('refresh',{project,repository:repo.id,repo:'',since:'7'});collection.push({repository:repo.id,ok:!String(log).includes('FAILED'),log});}
    catch(error){collection.push({repository:repo.id,ok:false,error:githubErrorText(error),log:String(error)});}
  }
  if(collection.some(c=>c.ok))S.prepareAfterLoad=project;
  // Newly connected code hands over to the analysis request: now when something was collected, else on the first refresh that collects it.
  const added=saved.repositories.filter(r=>!known.find(k=>k.id===r.id)).map(r=>r.id);
  if(added.length)S.openRequestFor={project,ids:added};
  return {saved:true,configuration:saved,collection};
}

  const rect = (id) => { const r = box.querySelector(`[data-w="${id}"]`).getBoundingClientRect(); return { x: r.left - o.left, y: r.top - o.top, w: r.width, h: r.height }; };

}

  $('map').innerHTML = searchPanel(m) + (view === 'changes' ? changesView(m) : sys ? sysView(m) : view === 'focus' ? focusView(m) : view === 'feat' ? featView(m) : storyMap(m)); $('insp').innerHTML = view === 'changes' ? changesInspector(m) : sys ? sysInspector(m) : view === 'focus' ? focusFeatureInspector(m) : view === 'feat' ? featInspector(m) : mapInspector(m);
  S._wires = null;
  if (view === 'focus' && S.focus) { const d = focusData(m); S._wires = d ? [...d.left.map((_, i) => ({ from: 'L' + i, to: 'C', h: true })), ...d.right.map((_, i) => ({ from: 'C', to: 'R' + i, h: true }))] : null; drawWires(); }
  if (view === 'feat') { const f = featureGraph(m); const fi = selectedFeature(m)?.i ?? null; S._wires = f.links.map((l, i) => ({ from: 'G' + (l.back && !l.fwd ? l.b : l.a), to: 'G' + (l.back && !l.fwd ? l.a : l.b), n: i + 1, style: l.ways.length ? '' : 'copy', noend: !l.ways.length, start: !!(l.fwd && l.back), dim: fi != null && l.a !== fi && l.b !== fi })); drawWires();
    document.querySelectorAll('[data-feat]').forEach(el => el.onclick = () => { const id = featureId(f.gs[+el.dataset.feat]); S.agentPrompt = null; S.feat = S.feat === id ? null : id; render(); });
    document.querySelectorAll('[data-goscr]').forEach(el => el.onclick = () => { S.view = 'map'; S.sel = el.dataset.goscr; S.open = null; render(); }); }
  document.querySelectorAll('[data-search-result]').forEach(el => el.onclick = () => openTarget(S._search[+el.dataset.searchResult], false));
  if ($('clearSearch')) $('clearSearch').onclick = () => { S.q = ''; $('q').value = ''; render(); $('q').focus(); };
  document.querySelectorAll('[data-chi]').forEach(el => el.onclick = () => { S.chi = +el.dataset.chi; render(); });
  if ($('olderChanges')) $('olderChanges').onchange = (e) => { if (e.target.value) { S.chi = +e.target.value; render(); } };
  if (view !== 'feat') document.querySelectorAll('[data-goscr]').forEach(el => el.onclick = () => { S.view = 'map'; S.sel = el.dataset.goscr; S.open = null; render(); });
  document.querySelectorAll('.tw[data-url]').forEach(el => el.onclick = () => invoke('open_url', { url: el.dataset.url }));
  document.querySelectorAll('[data-f]').forEach(el => el.onclick = (e) => { e.stopPropagation(); setFocus(el.dataset.f); });
  if ($('unfocus')) $('unfocus').onclick = () => { S.focus = null; render(); };
  $('map').scrollTop = top; $('map').scrollLeft = left; $('insp').scrollTop = itop;
  document.querySelectorAll('[data-proposal]').forEach(b => b.onclick = () => { S.showProposal = b.dataset.proposal === '1'; S.node = null; render(); });
  if ($('remakeSys')) $('remakeSys').onclick=()=>openAnalysisPanel('make_system');
  if ($('requestBriefing')) $('requestBriefing').onclick=()=>openAnalysisPanel('briefing_request');
  if (sys && S.system) { S._wires = sysLinks(S.system).map((l, i) => ({ ...l, n: i + 1, dim: !!S.node && l.from !== S.node && l.to !== S.node })); drawWires(); document.querySelectorAll('.card[data-node], .row[data-node]').forEach(el => el.onclick = () => { selectProgram(el.dataset.node); });
    if ($('toMap')) $('toMap').onclick = () => { S.view = 'map'; render(); } }
  const pick=p=>selectScreen(p,view==='focus');
  document.querySelectorAll('[data-scr]').forEach(el => el.onclick = () => pick(el.dataset.scr));
  document.querySelectorAll('[data-req]').forEach(el => el.onclick = () => { S.open = S.open === el.dataset.req ? null : el.dataset.req; S.step = -1; S.ev = -1; render(); });
  document.querySelectorAll('[data-step]').forEach(el => el.onclick = () => { const i = +el.dataset.step; S.ev = S.ev === i ? -1 : i; render(); });
  document.querySelectorAll('.row[data-url]').forEach(el => el.onclick = () => invoke('open_url', { url: el.dataset.url }));
  document.querySelectorAll('a[data-url], button[data-url]').forEach(a => a.onclick = (e) => { e.stopPropagation(); invoke('open_url', { url: a.dataset.url }); });
  const s = m.screens.find(x => x.path === S.sel); const rows = s ? requests(m, s.path) : [];
  const stepCount = () => { const r = rows.find(x => x.key === S.open); const f = r && flowOf(r.route); return f ? f.steps.length : 0; };
  if ($('next')) $('next').onclick = () => { S.step = S.step >= stepCount() ? -1 : S.step + 1; S.ev = -1; render(); };
  if ($('prev')) $('prev').onclick = () => { S.step = S.step <= 0 ? -1 : S.step - 1; S.ev = -1; render(); };
  const copy = async (text, el) => { await navigator.clipboard.writeText(text); el.textContent = tr('복사됨'); setTimeout(() => render(), 900); };
  if ($('copyS')) $('copyS').onclick = () => copy(copyText(m, s), $('copyS'));
  // 고른 기능: 지도에서 보기·기능 개요로 돌아가기·다른 기능으로 바꾸기·해제. 지도는 늘 전체를 그린다.
  const reveal = () => document.querySelector('#map .card.sel, #map .col.featured')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  const toMap = (path, key) => { S.view = 'map'; S.sel = path; S.open = key; S.step = -1; S.ev = -1; render(); reveal(); };
  if ($('featMap')) $('featMap').onclick = () => toMap(null, null);
  if ($('featBack')) $('featBack').onclick = () => toMap(null, null);
  if ($('featSwitch')) $('featSwitch').onclick = () => { S.feat = featureId(featureOf(m, featureTarget().id)); render(); };
  if ($('featClear')) $('featClear').onclick = () => { S.feat = null; render(); };
  if ($('copyF')) $('copyF').onclick = () => copy(featureCopyText(m, selectedFeature(m)), $('copyF'));
  document.querySelectorAll('[data-goact]').forEach(el => el.onclick = () => toMap(el.dataset.goact, el.dataset.key));
  // 테스트가 안 이어진 서버 기능: 에이전트에게 테스트를 찾게 하는 글(mapcore.tests_prompt)을 복사한다
  document.querySelectorAll('[data-tp]').forEach(b => b.onclick = async () => {
    let text;
    try { text = await invoke('tests_prompt', { project: S.project, route: b.dataset.tp, lang: S.lang, repository: b.dataset.repository || S.repository }); }
    catch (err) { $('tpDone').innerHTML = ' ' + errorHtml(tr('요청을 만들지 못했습니다. 오류 내용을 확인하세요.'), String(err)); return; }
    // 복사가 막혀도 실제 요청 원문이 있으니 직접 복사할 수 있게 펼칠 칸을 준다.
    try { await navigator.clipboard.writeText(text); $('tpDone').textContent = ' ' + tr('복사했습니다. 작업하던 AI 채팅에 붙여 넣으세요.'); }
    catch { $('tpDone').innerHTML = ' ' + esc(tr('복사하지 못했습니다. 다시 시도하거나 안내를 열어 직접 복사하세요.')) + helpDetails(`<pre class="prompt mono">${esc(text)}</pre>`, '요청 내용 보기'); } });
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copy(copyText(m, s, rows.find(x => x.key === b.dataset.copy)), b));
  document.querySelectorAll('[data-confirm-link]').forEach(b => b.onclick = () => editProject(false, { link: b.dataset.confirmLink.split('|') }));
  if ($('mk')) $('mk').onclick=()=>openAnalysisPanel();
  document.querySelectorAll('[data-mk]').forEach(b => b.onclick = () => openAnalysisPanel());
  if ($('regroup')) $('regroup').onclick=()=>openAnalysisPanel('suggest_groups');
  renderPendingActions();
  if (S.agentPrompt != null) renderAgentPrompt();
  keyboardTargets(); if (refocus) document.querySelector(refocus)?.focus();
  if(typeof controlDecoration==='function')controlDecoration();
}

async function persistSettings(value) {
  if(!value || typeof value!=='object')throw Error('Settings object required');
  S.settings=JSON.parse(await invoke('save_settings',{json:JSON.stringify(value)}));renderHeader();return S.settings;
}
$('q').oninput = () => { S.q = $('q').value; render(); };
$('q').onkeydown = (e) => { if (e.key === 'Enter' && S._search?.length) openTarget(S._search[0], false); if (e.key === 'Escape') { S.q = ''; $('q').value = ''; render(); } };
// 오류 내용 칸의 복사 버튼: 막히면 원문은 칸 안에 그대로 보인다.
document.addEventListener('click',async e=>{const b=e.target.closest?.('[data-copy-error]');if(!b)return;try{await navigator.clipboard.writeText(b.closest('details').querySelector('pre').textContent);b.textContent=tr('복사됨');}catch{b.textContent=tr('복사하지 못했습니다.');}});
document.addEventListener('keydown', e => { const el = e.target; if ((e.key === 'Enter' || e.key === ' ') && el.matches?.(KEY_SELECTOR) && !nativeKey(el)) { e.preventDefault(); el.click(); } });
$('refresh').onclick = doRefresh;
function renderSettings() {
  const dialog=$('settings-dialog'), st=S.settings;
  const radio=(value,label)=>`<label class="kv opt"><input type="radio" name="since" value="${value}" ${st.since===value?'checked':''}> ${tr(label)}</label>`;
  dialog.innerHTML=`${sectionHeading('설정',`<button class="btn quiet" id="closeSettings">${tr('닫기')}</button>`,`<span class="pill">${tr('모든 서비스')}</span>`,'settingsTitle')}<h3>${tr('언제부터 바뀐 내용을 볼까요?')}</h3>
    <div class="setting-options"><div>${radio('last_refresh','지난 새로고침 이후')}<p class="s" id="baselineNotice" title="${esc(tr(BASELINE_NOTICE))}">${tr('새로고침마다 시작점 이동')}</p></div><div>${radio('my_commit','내 마지막 커밋 이후')}</div><div>${radio('time','지정한 시각 이후')}<p class="s">${tr('고정된 시작점')}</p></div></div>
    <label>${tr('시작 시각')} <input type="datetime-local" id="sinceTime" value="${esc(st.since_time)}"></label>
    <h3>${tr('새로고침')}</h3><label class="kv opt"><input type="checkbox" id="openRefresh" ${st.open_refresh?'checked':''}> ${tr('서비스를 열 때 새로고침')}</label>
    <div class="ctl"><button class="btn primary" id="saveRefresh" ${S.project?'':'disabled'}>${tr('저장하고 새로고침')}</button><button class="btn" id="saveSt">${tr('저장')}</button></div><div id="settingsError" role="alert"></div>`;
  $('closeSettings').onclick=()=>dialog.close();
  const timeState=()=>{const since=dialog.querySelector('input[name=since]:checked').value;$('sinceTime').disabled=since!=='time';$('baselineNotice').hidden=since!=='last_refresh';};
  dialog.querySelectorAll('input[name=since]').forEach(input=>input.onchange=timeState);timeState();
  $('saveSt').onclick=async()=>{
    const value={open_refresh:$('openRefresh').checked,since:dialog.querySelector('input[name=since]:checked').value,since_time:$('sinceTime').value};
    if(value.since==='time' && !value.since_time){$('settingsError').textContent=tr('시각을 정해 주세요.');return;}
    $('saveSt').disabled=true;
    try { await persistSettings(value);dialog.close();return true; }
    catch(error){$('settingsError').innerHTML=String(error).includes('Choose a valid comparison time')?errorHtml(tr('시각을 정해 주세요.'),String(error)):errorHtml(tr('설정을 저장하지 못했습니다. 오류 내용을 확인하세요.'),String(error));}
    finally {if($('saveSt'))$('saveSt').disabled=false;}
  };
  if($('saveRefresh'))$('saveRefresh').onclick=async()=>{if(await $('saveSt').onclick())await doRefresh();};
}
$('settings').onclick=()=>{renderSettings();$('settings-dialog').showModal();};
document.querySelectorAll('#language button').forEach(b => b.onclick = () => setLanguage(b.dataset.lang));
renderHeader();
// 에이전트 연결: 프롬프트를 복사해 자기 에이전트에 붙이면 에이전트가 등록과 전역 지침 추가를 한다
function renderAgentPrompt() {
  if(S.agentPurpose==='connection')return renderConnectionDiagnostic();
  const analysis=S.agentPurpose==='analysis',request=analysis?activeAnalysis():null;
  const states={up_to_date:'모든 분석 결과가 최신입니다. 새로 요청할 것이 없습니다.',blocked:'요청하지 못한 분석: ',proposal_previous:'이전에 저장된 AI 제안입니다.',proposal_partial:'일부 분석만 저장됐고 AI 제안은 따로 보관했습니다.',prepared:'작업하던 AI 채팅에 요청을 붙여 넣으세요.',checking:'저장된 결과를 확인하는 중…',missing:'새 결과가 아직 없습니다. AI가 저장을 마치면 앱으로 돌아왔을 때 읽습니다.',saved:'새 결과가 저장된 것을 확인했습니다.',proposal:'새 분석 결과가 저장됐고 AI 제안은 따로 저장했습니다.',partial:'일부 결과만 새로 저장됐습니다. 나머지 작업도 저장된 뒤 다시 확인하세요.',previous:'이전에 저장된 결과입니다. 이번 요청의 새 결과는 아직 확인되지 않았습니다.',stale:'다른 코드 버전의 결과입니다. 현재 코드로 다시 분석을 요청하세요.'};
  const task=request && (ANALYSIS_TASKS.find(t=>t[0]===request.command)?.[1] || (request.command==='make_steps'?'동작 과정':''));
  const target=request?.target==='*' ? tr('연결한 코드 전체') : request?.target ? connectionDisplayName(request.target) : '';
  // 주 동작은 하나다: 결과가 오기 전에는 요청 복사, 결과가 오면 결과 보기. 앱으로 돌아오면 결과는 스스로 읽으므로 수동 확인·요청 원문·다른 분석은 접어 둔다.
  const ready=request && ['saved','previous','proposal','proposal_previous','proposal_partial','partial'].includes(request.state);
  const status=request?.error?errorHtml(tr('결과를 읽지 못했습니다. 오류 내용을 확인하세요.'),request.error):tr(request?.state==='prepared' && request.copied?'복사했습니다. 작업하던 AI 채팅에 붙여 넣고, AI가 끝나면 앱으로 돌아오세요.':states[request?.state] || states.prepared);
  const steps=request && ['up_to_date','blocked'].includes(request.state)?`<p class="sub">${esc(tr(task || ''))}</p><div role="status">${tr(states[request.state] || '')}</div>${planSummary(request)}`:request?`<p class="sub">${esc([tr(task || ''),target].filter(Boolean).join(' · '))}</p><div id="analysisResultState" role="status">${status}</div>${['partial','proposal_partial'].includes(request.state) && request.codes ? `<div class="s" data-codes>${[['saved','결과가 저장된 코드: '],['partial','일부 결과만 저장된 코드: '],['waiting','결과를 기다리는 코드: ']].filter(([k])=>request.codes[k].length).map(([k,label])=>`<div>${tr(label)}${esc(request.codes[k].map(connectionDisplayName).join(', '))}</div>`).join('')}</div>` : ''}<div class="ctl">${request.state==='error'?`<button class="btn primary" id="checkAnalysisResults">${tr('결과 확인')}</button>`:''}${ready?`<button class="btn primary" id="viewAnalysisResults">${tr(request.state.startsWith('proposal')?'AI 제안 보기':'결과 보기')}</button>`:''}<button class="btn ${ready || request.state==='error'?'quiet':'primary'}" id="cpAgent">${tr('요청 복사')}</button><span id="cpDone">${request.copied && ready?tr('복사됨'):''}</span></div>${request.command==='analysis_plan'?planSummary(request):''}`:'';
  const more=request && !['up_to_date','blocked'].includes(request.state)?`<details class="sect"><summary>${tr('다시 확인·요청 내용·다른 분석')}</summary>${request.state==='error'?'':`<button class="btn quiet" id="checkAnalysisResults" ${request.state==='checking'?'disabled':''}>${tr('결과 확인')}</button>`}<pre class="prompt mono">${esc(request.handoff ?? S.agentPrompt)}</pre>${analysisChooser(true)}</details>`:analysisChooser();
  // AI 사용량·요금 안내는 이 패널에 한 번만 보인다.
  $('insp').innerHTML=analysis?`<h2>${tr('AI로 자세한 지도 만들기')}</h2>`+(typeof AnalysisRun!=='undefined'?AnalysisRun.html():'')+`<h3>${S.lang==='en'?'Copy a request for your existing AI':'기존 AI에게 요청 복사'}</h3><p class="s">${tr('연결한 AI가 분석하며, 사용하는 AI의 요금·사용 한도가 적용됩니다.')}</p>`+steps+more:
    `<h2>${tr('AI 연결')}</h2><p>${tr('AI 연결을 설정하고 공통 지시 파일에 사용 규칙을 추가합니다. 변경 전 확인을 요청합니다.')}</p>`+(S.agentPromptError?`<div role="alert">${errorHtml(tr('안내를 만들지 못했습니다. 다시 시도하세요.'),S.agentPromptError)}</div>`:ui`<div class="ctl"><button class="btn primary" id="cpAgent">복사</button><span id="cpDone"></span></div>`)+`<button class="btn" id="openConnectionDiagnostic">${tr('연결 진단')}</button>${S.agentPromptError?'':helpDetails(`<pre class="prompt mono">${esc(S.agentPrompt)}</pre>`,'연결 안내 보기')}`;
  if($('cpAgent'))$('cpAgent').onclick=async()=>{
    const prompt=analysis?request.handoff ?? S.agentPrompt:S.agentPrompt,copyRequest=S.analysisRequest;
    try {await navigator.clipboard.writeText(prompt);if(analysis?copyRequest!==S.analysisRequest:S.agentPrompt!==prompt)return;if(analysis){copyRequest.copied=true;renderAgentPrompt();}else $('cpDone').textContent=tr('복사됨');}
    catch {if($('cpDone'))$('cpDone').textContent=tr('복사하지 못했습니다. 다시 시도하거나 안내를 열어 직접 복사하세요.');}
  };
  if($('openConnectionDiagnostic'))$('openConnectionDiagnostic').onclick=()=>startConnectionDiagnostic();
  if(!analysis)return;
  if(typeof AnalysisRun!=='undefined')AnalysisRun.bind();
  if($('checkAnalysisResults'))$('checkAnalysisResults').onclick=checkAnalysisResults;
  if($('viewAnalysisProposal'))$('viewAnalysisProposal').onclick=()=>{S.agentPrompt=null;S.showProposal=true;S.view='sys';render();};
  if($('viewAnalysisResults'))$('viewAnalysisResults').onclick=()=>{S.agentPrompt=null;S.showProposal=request.state.startsWith('proposal');S.view=request.command==='analysis_plan'?(request.requirements.some(r=>['analysis','system'].includes(r.task))?'sys':request.requirements.some(r=>r.task==='groups')?'feat':'changes'):request.command==='briefing_request'?'changes':request.command==='make_system' || request.command==='analysis_request'?'sys':request.command==='suggest_groups'?'feat':S.view;render();};
  if($('analysisTarget'))$('analysisTarget').onchange=e=>{S.analysisChoice={...S.analysisChoice,target:e.target.value};renderAgentPrompt();};
  document.querySelectorAll('[data-analysis-task]').forEach(b=>b.onclick=()=>{const key=b.dataset.analysisTask;S.analysisChoice={...S.analysisChoice,task:key};requestAgentAction(key,!['briefing_request','analysis_plan'].includes(key) && $('analysisTarget')?{repository:analysisTarget()}:{});});
  if($('analyzeMap'))$('analyzeMap').textContent=analysisButtonText();
}
$('agent').onclick = async () => { S.agentPurpose='setup';S.agentPromptError=null;try { S.agentPrompt = await invoke('setup_prompt', {lang: S.lang}); } catch (e) { S.agentPrompt = '';S.agentPromptError=String(e); } renderAgentPrompt(); };

document.querySelectorAll('#view button, #subview button').forEach(b => b.onclick = () => { S.agentPrompt = null; S.view = b.dataset.v === 'work' ? S.workView || 'feat' : b.dataset.v; render(); });

$('newProject').onclick = () => editProject(true);

(async () => {
  try { U.current = await invoke('app_version'); await pollUpdate(); renderUpdates(); await checkUpdates(false); }
  catch { U.failed = true; renderUpdates(); }
})();
(async () => {
  try { S.settings=JSON.parse(await invoke('read_settings')); }
  catch(error) { S.settingsError=String(error); }
  const ps = await invoke('list_projects');
  $('project').innerHTML = ps.map(p => `<option>${esc(p)}</option>`).join('') || tr('<option data-empty>(없음)</option>');
  if (ps.length) await loadProject(ps[0]); else { S.firstRun = true; render(); if (typeof guideFirstRun === 'function') guideFirstRun(); }
  // Loading a project clears the status line, so a settings read failure is shown after it.
  if (S.settingsError) setStatus(tr('설정을 읽지 못했습니다. 오류 내용을 확인하세요.'),true,S.settingsError);
