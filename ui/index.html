// 선: 에이전트가 적은 것 + 계산한 것(사본에 다른 판이 든 파일의 주인 상자로 점선)
function sysLinks(y) { const out = [...y.links]; const by = {};
  for (const d of copyDiffs()) { const o = ownerOf(d.path); if (!o || o.id === d.node.id) continue; ((by[d.node.id + '>' + o.id] ??= { from: d.node.id, to: o.id, files: new Set() }).files).add(d.path); }
  for (const l of Object.values(by)) out.push({ from: l.from, to: l.to, style: 'copy', sure: 'calc', label: ui`${y.nodes.find(n => n.id === l.to).name}의 파일 ${l.files.size}개가 다른 판으로 들어 있다. 같은 파일이 두 판으로 함께 돈다`, ev: [] });
  return out; }
const jobsOf = (key) => S.jobs ? Object.entries(S.jobs.nodes).flatMap(([id, v]) => v.jobs.filter(j => j.routes.some(r => r.key === key)).map(j => ({ node: (S.system ? S.system.nodes : []).find(n => n.id === id) || { name: id }, job: j, exact: j.routes.find(r => r.key === key).exact }))) : [];
const progs = (table) => (S.system ? S.system.nodes : []).filter(n => (n.tables || []).includes(table));
function setFocus(f) { S.agentPrompt = null; const i = f.indexOf('|'); const t = f.slice(0, i), id = f.slice(i + 1); S.focus = { t, id }; S.view = 'focus'; S.step = -1; S.ev = -1;
  if (t === 'screen') { S.sel = id; S.open = null; } if (t === 'route') { const u = routeUse(M())[id]; if (u) { S.sel = u[0].s.path; S.open = id; } }
  render(); $('map').scrollTop = 0; $('insp').scrollTop = 0; }
function focusData(m) {
  const { t, id } = S.focus; const scr = (p, sub) => ({ f: 'screen|' + p, name: label(m, p), ai: isAi(m, p), sub });

      note: tr('메뉴와 탭으로 오가는 길은 뺐다. 가운데 알약은 이 화면이 닿는 저장소다.') }; }
  if (t === 'table') { const u = tableUse(m)[id] || { w: new Map(), r: new Map() }; const row = (word) => ([p, rs]) => scr(p, `${word} ${rs.length}: ${reqLabel(rs[0])}${rs.length > 1 ? tr(' 외') : ''}`);
    return { kind: tr('저장소'), name: id, sub: '', lt: tr('이 저장소를 바꾸는 쪽'), rt: tr('이 저장소를 읽는 화면'), left: [...progs(id).map(n => ({ name: n.name, sub: tr('서버를 거치지 않고 직접 읽고 쓴다') })), ...[...u.w].map(row(tr('바꾸는 요청')))], right: [...u.r].map(row(tr('읽는 요청'))),
      note: tr('읽기와 바꾸기는 요청 방식으로만 갈랐다. 읽는 요청이 안에서 값을 바꾸는 경우는 가려내지 못한다.') }; }
  const u = routeUse(m)[id] || []; const r = u[0] && u[0].r; if (!r) return null;
  return { kind: tr('서버 기능'), name: reqLabel(r), ai: reqIsAi(r), sub: r.route.method + ' ' + r.route.path, lt: tr('이 서버 기능을 부르는 화면'), rt: tr('닿는 저장소와 바깥 서비스'), left: u.map(x => scr(x.s.path, x.r.btn ? ui`"${x.r.btn}" 버튼` : tr('버튼 글자를 못 찾음'))),
    right: [...(r.route.tables || []).map(tb => ({ f: 'table|' + tb, name: tb, sub: tr('저장소') })), ...(r.route.externals || []).map(e => ({ name: e, sub: tr('바깥 서비스') }))], note: '' };

function focusView(m) {
  const d = S.focus && focusData(m);
  if (!d) { const tu = tableUse(m); const all = [...new Set([...Object.values(m.models || {}), ...Object.keys(tu)])].map(t => ({ t, w: tu[t] ? tu[t].w.size : 0, r: tu[t] ? tu[t].r.size : 0, p: progs(t) })).sort((a, b) => (b.w + b.r) - (a.w + a.r) || a.t.localeCompare(b.t));

      <div class="sect"><h4>저장소 ${all.length}</h4><div class="group">` + all.map(x => `<div class="row click" data-f="table|${esc(x.t)}"><div class="grow"><div class="t mono">${esc(x.t)}</div></div><span class="s">${x.w + x.r ? ui`바꾸는 화면 ${x.w} · 읽는 화면 ${x.r}` : tr('화면에서 닿지 않음')}</span>${x.p.map(n => ui`<span class="pill warn">${esc(n.name)}도 직접 씀</span>`).join('')}</div>`).join('') + `</div></div>`; }
  const card = (c, w) => `<div class="card node ${c.f ? '' : 'plain'}" data-w="${w}" ${c.f ? `data-f="${esc(c.f)}"` : ''}><div class="nm"><span class="${c.ai ? 'ai' : ''}">${esc(c.name)}</span></div><div class="s">${esc(c.sub || '')}</div></div>`;

  return ui`<div class="legend"><button class="btn plain" id="unfocus">‹ 저장소 목록</button><span>옆 카드를 누르면 그것이 가운데로 온다.</span><span>${esc(d.note)}</span></div><div class="focus" id="sys">${WIRES}${col(d.lt, d.left, 'L')}
    <div class="fcol"><div class="zone">${d.kind}</div><div class="card node sel" data-w="C"><div class="nm"><span class="${d.ai ? 'ai' : ''}">${esc(d.name)}</span></div><div class="s mono">${esc(d.sub)}</div>${d.chips ? `<div class="meta">${d.chips.map(t => `<span class="pill ok click" data-f="table|${esc(t)}">${esc(t)}</span>`).join('')}</div>` : ''}</div></div>${col(d.rt, d.right, 'R')}</div>`;

function focusInspector(m) {

  const { t, id } = S.focus; if (t === 'screen') return inspector(m);
  if (t === 'route') { const u = (routeUse(m)[id] || [])[0]; return u ? ui`<h2><span class="${reqIsAi(u.r) ? 'ai' : ''}">${esc(reqLabel(u.r))}</span></h2><p class="sub">서버 기능</p><div class="sect"><div class="group">${detail(m, u.s, u.r)}</div></div>` : ''; }
  const u = tableUse(m)[id] || { w: new Map(), r: new Map() }; const list = (mp) => [...mp].flatMap(([p, rs]) => rs.map(r => ui`<div class="row click" data-f="route|${esc(r.key)}"><span title="자동 테스트"><i class="dot ${(r.route.tests || []).length ? 'ok' : ''}"></i></span><div class="grow"><div class="t"><span class="${reqIsAi(r) ? 'ai' : ''}">${esc(reqLabel(r))}</span></div><div class="s">${esc(label(m, p))}</div></div></div>`)).join('') || tr('<div class="row"><div class="grow empty">없다</div></div>');

// ---------- 묶어서 그리기 ----------

  const m = M();

  if ($('mkJobs')) $('mkJobs').onclick = async () => { const b = $('mkJobs'); b.disabled = true; $('jobslog').textContent = tr('에이전트가 코드를 읽는 중… 몇 분'); try { await invokeAction('make_jobs', { project: S.project, node: b.dataset.node }); await loadProject(S.project, false); } catch (e) { $('jobslog').textContent = tr('실패: ') + String(e).slice(0, 160); b.disabled = false; } };

  if (sys && S.system) { S._wires = sysLinks(S.system).map((l, i) => ({ ...l, n: i + 1, dim: !!S.node && l.from !== S.node && l.to !== S.node })); drawWires(); document.querySelectorAll('[data-node]').forEach(el => el.onclick = () => { S.node = S.node === el.dataset.node ? null : el.dataset.node; render(); });

// 에이전트 연결: 프롬프트를 복사해 자기 에이전트에 붙이면 에이전트가 등록과 전역 지침 추가를 한다

(async () => {
